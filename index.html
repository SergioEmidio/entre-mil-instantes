<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10182b">
  <meta name="robots" content="noindex, nofollow">
  <title>Entre Mil Instantes</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/base.css">
</head>
<body>
  <!-- Fase 0: página provisória. Na fase 1 entra a contagem, a senha e o carregamento. -->
  <main class="tela tela--centro">
    <div class="estrelas" aria-hidden="true">
      <span class="estrela" style="top: 12%; left: 16%"></span>
      <span class="estrela" style="top: 20%; left: 78%; animation-delay: 1.2s"></span>
      <span class="estrela" style="top: 34%; left: 40%; animation-delay: 2.1s"></span>
      <span class="estrela" style="top: 72%; left: 20%; animation-delay: 0.6s"></span>
      <span class="estrela" style="top: 82%; left: 84%; animation-delay: 1.7s"></span>
    </div>

    <p class="rotulo">Em breve</p>
    <h1 class="titulo titulo--italico titulo-g" style="margin-top: 14px">Tem uma coisa sendo preparada.</h1>
  </main>
</body>
</html>
