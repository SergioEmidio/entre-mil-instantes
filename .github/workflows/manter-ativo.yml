# Mantém o Supabase acordado.
# O plano grátis pausa o projeto depois de uns 7 dias sem uso, e aí o site para.
# Isto faz uma consulta simples todo dia, sozinho, pelo GitHub.
#
# Precisa de 2 segredos no repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_URL           → a mesma Project URL do js/config.js (sem aspas)
#   SUPABASE_CHAVE_PUBLICA → a mesma Publishable key do js/config.js (sem aspas)

name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 12 * * *"   # todo dia às 09:17 de Brasília
  workflow_dispatch:         # botão "Run workflow" para testar na hora

jobs:
  cutucar:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta simples no banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_CHAVE_PUBLICA: ${{ secrets.SUPABASE_CHAVE_PUBLICA }}
        run: |
          # Limpa aspas, espaços e quebras de linha que vêm junto ao colar.
          URL=$(printf '%s' "$SUPABASE_URL" | tr -d "\"' \r\n")
          CHAVE=$(printf '%s' "$SUPABASE_CHAVE_PUBLICA" | tr -d "\"' \r\n")
          URL="${URL%/}"

          if [ -z "$URL" ] || [ -z "$CHAVE" ]; then
            echo "::error::Faltam os segredos SUPABASE_URL e SUPABASE_CHAVE_PUBLICA."
            exit 1
          fi

          case "$URL" in
            https://*.supabase.co) ;;
            *)
              echo "::error::O segredo SUPABASE_URL está no formato errado. Tem que ser assim: https://xxxx.supabase.co"
              exit 1
              ;;
          esac

          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            "$URL/rest/v1/configuracao?select=id" \
            -H "apikey: $CHAVE") || codigo="sem_conexao"

          echo "Resposta do Supabase: $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::O Supabase não respondeu 200. Confere a chave (SUPABASE_CHAVE_PUBLICA) e se o projeto não está pausado."
            exit 1
          fi
