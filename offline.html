<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10182b">
  <meta name="robots" content="noindex, nofollow">
  <title>Sem internet · Nossos Instantes</title>
  <link rel="icon" href="./icones/favicon-48.png" type="image/png">
  <link rel="stylesheet" href="./css/base.css">
  <style>
    body { background: #10182b; }
    .offline {
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 420px;
      margin: 0 auto;
      padding: calc(32px + env(safe-area-inset-top)) 28px calc(32px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }
    .offline img { width: 96px; height: 96px; border-radius: 24px; }
    .offline h1 { margin: 6px 0 0; }
    .offline p { margin: 0; line-height: 1.55; }
  </style>
</head>
<body>
  <main class="offline">
    <img src="./icones/icone-192.png" alt="">
    <p class="rotulo">Sem internet agora</p>
    <h1 class="titulo titulo--italico titulo-m">Os nossos instantes estão guardados.</h1>
    <p class="texto-2">As fotos, as cartas e as músicas ficam guardadas na nuvem. Liga a internet (Wi-Fi ou dados) e toca no botão.</p>
    <button class="botao botao--primario botao--largo" type="button" onclick="location.href='./'">Tentar de novo</button>
  </main>
</body>
</html>
